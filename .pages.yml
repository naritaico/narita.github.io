media:
  input: assets/images/uploads
  output: /assets/images/uploads



content:

  - name: projects
    label: Projects
    type: collection
    filename: "{title}.md"
    path: _projects
    view:
      fields: [title, date, images, featured, tags]
      primary: title
      sort: [title, date, images, featured, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: how-to
        label: "How to use this form"
        type: text
        readonly: true
        default: "1. Choose a layout. 2. Add a title and date. 3. Upload images."
      - name: layout
        label: "Choose layout"
        type: select
        required: true
        default: project-default
        description: "Don't add images if using the text-only layout"
        options:
          values:
            - name: project-default
              label: "Project layout with images"
            - name: project-text
              label: "Text-only layout"

      - name: title
        label: "Title"
        type: string
        required: true
        description: "Don't make the title super long"

      - name: date
        label: "Date"
        type: date
        required: true
        description: "Month & year only, just use first day of the month"

      - name: location
        label: "Location"
        type: string

      - name: additional-fields
        label: "Additional fields"
        type: string
        list: true
        description: "Studio/firm/school/affiliation/organization, course, people, awards, etc."

      - name: body
        label: "Description"
        type: rich-text
        options:
          media: false

      - name: images
        label: "Images"
        type: image
        list: true
        options:
          unique: true

      - name: featured
        label: "Feature on homepage?"
        type: boolean

      - name: tags
        label: "Tags"
        type: select
        required: true
        options:
          multiple: true
          values:
            - name: architecture
              label: "Architecture"
            - name: landscape-architecture
              label: "Landscape architecture"
            - name: art
              label: "Art"
            - name: photography
              label: "Photography"
            - name: published
              label: "Published"
            - name: awarded
              label: "Awarded"
