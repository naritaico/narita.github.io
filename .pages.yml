media:
  input: assets/images/uploads
  output: /assets/images/uploads

content:
  - name: projects
    label: Projects
    type: collection
    filename: "{title}.md"
    path: _projects
    fields:
      - name: layout
        label: "Choose layout"
        type: select
        required: true
        default: project-default
        description: "Don't add images if using the text-only layout"
        options:
          values:
            - name: project-default
              label: "Project layout with images"
            - name: project-text
              label: "Text-only layout"

      - name: title
        label: "Title"
        type: string
        required: true
        description: "Don't make the title super long"

      - name: date
        label: "Date"
        type: date
        required: true
        description: "Month & year only, just use first day of the month"

      - name: location
        label: "Location"
        type: string

      - name: additional-fields
        label: "Additional fields"
        type: string
        list: true
        description: "Studio/firm/school/affiliation/organization, course, people, awards, etc."

      - name: body
        label: "Description"
        type: rich-text
        options:
          media: false

      - name: images
        label: "Images"
        type: image
        list: true
        options:
          rename: true

      - name: featured
        label: "Feature on homepage?"
        type: boolean

      - name: tags
        label: "Tags"
        type: select
        required: true
        options:
          multiple: true
          values:
            - name: architecture
              label: "Architecture"
            - name: landscape-architecture
              label: "Landscape architecture"
            - name: art
              label: "Art"
            - name: photography
              label: "Photography"
            - name: publications
              label: "Publications"
            - name: speaking
              label: "Speaking"
            - name: awarded
              label: "Awarded"

  - name: cv
    label: CV
    file: cv-test.html
    fields:
      - &cv_titles
        name: titles
        label: Titles
        type: list
        fields:
          - name: text
            label: Text
            type: string
            required: true
          - name: style
            label: Style
            type: select
            options:
              values:
                - { name: normal, label: Normal }
                - { name: italic, label: Italic }
            default: normal
          - name: language
            label: "Language code (optional, e.g. tl)"
            type: string

      - &cv_3col_fields
        - name: start_date
          label: Start date
          type: date
          required: true
        - name: end_date
          label: End date
          type: date
        - name: current
          label: "Still ongoing (shows “present”)"
          type: boolean
          default: false
        - *cv_titles
        - name: institution
          label: Institution
          type: string
        - name: location
          label: Location
          type: string

      - name: education
        label: Education
        type: list
        fields: *cv_3col_fields
      - name: work_experience
        label: Work Experience
        type: list
        fields: *cv_3col_fields
      - name: fellowships
        label: Fellowships
        type: list
        fields: *cv_3col_fields
      - name: scholarships_grants
        label: "Scholarships & Grants"
        type: list
        fields:
          - name: date
            label: Date
            type: date
            required: true
          - name: title
            label: Title
            type: string
            required: true
      - name: exhibitions
        label: Exhibitions
        type: list
        fields: *cv_3col_fields
      - name: updated_note
        label: 'Updated note (e.g. "September 2026")'
        type: string
